# Publishes the Astraeus packages to npm (O-036 T-162). Runs when you publish a GitHub release; docs/RELEASING.md is the owner's step-by-step.
# npm trusted publishing: no token is stored; the runner signs in to npm with its OIDC identity (id-token: write) and npm adds a provenance statement.
# A manual run (Actions tab, "Run workflow") is a DRY RUN: it does every step except sending anything to npm.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require npm 11.5.1 or later (trusted publishing needs it)
        run: |
          node --version
          npm --version
          node -e 'const found = /^(\d+)\.(\d+)\.(\d+)/.exec(process.argv[1]); if (found === null) { console.error("cannot read the npm version \"" + process.argv[1] + "\"; need 11.5.1 or later"); process.exit(1); } const [major, minor, patch] = found.slice(1).map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { console.error("npm " + process.argv[1] + " is too old for trusted publishing; need 11.5.1 or later"); process.exit(1); }' "$(npm --version)"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:engine-alone
      - name: Build the packages and check what they pack
        run: npm run check:pack
      - name: Publish (release) or dry-run (manual run)
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            node tools/publish-packages.mjs --tag "$TAG"
          else
            node tools/publish-packages.mjs --dry-run
          fi

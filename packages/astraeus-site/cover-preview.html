<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astraeus loading cover preview</title>
    <style>
      /* Dev-only page for the owner's look at the opt-in loading cover (O-061 T-288). Not in the build's inputs, so the public site does not carry it. */
      html, body { height: 100%; margin: 0; background: #222; color-scheme: dark; }
      #app { position: relative; height: 100%; }
      body[data-box] #app { width: min(480px, 90vw); height: 320px; margin: 40px auto; outline: 1px solid #555; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // ?box=1 draws the viewer in a 480x320 box (the cover must fit the box, not the window); ?fade=N sets the fade seconds (default 2) so it can be watched.
      import { Scene, earth, moon, mount } from "astraeus";
      const params = new URLSearchParams(location.search);
      if (params.has("box")) document.body.dataset.box = "";
      const fade = Number(params.get("fade") ?? 2);
      const scene = new Scene().addBody(earth).addBody(moon, { orbit: true }).setLook({ loadFadeSeconds: Number.isFinite(fade) ? fade : 2 });
      mount(document.getElementById("app"), scene, { loadingCover: true });
    </script>
  </body>
</html>

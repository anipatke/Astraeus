<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inner planets</title>
    <style>
      /* The page owns its layout: the viewer fills the top, the app's own controls sit in a strip below it, so nothing overlaps at any window size. */
      html, body { margin: 0; height: 100%; background: #000; color: #dfe6f0; font: 14px/1.3 system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #app { flex: 1 1 auto; min-height: 0; position: relative; }
      #controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 12px; background: #0b0f16; border-top: 1px solid #263040; }
      #controls label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
      #controls input[type="range"] { width: 110px; }
      #controls button { font: inherit; color: inherit; background: #1b2433; border: 1px solid #38465c; border-radius: 4px; padding: 4px 10px; }
      @media (max-width: 600px) {
        #controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding: 6px 10px; }
        #controls label { flex-direction: column; align-items: stretch; gap: 2px; white-space: normal; }
        #controls input[type="range"] { width: 100%; }
        #controls button { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="controls">
      <label>Star brightness <input id="stars" data-host="stars" type="range" min="0" max="2" step="0.05" /></label>
      <label>Sun glow <input id="glow" data-host="glow" type="range" min="0" max="2" step="0.05" /></label>
      <label>Glow size <input id="glow-size" data-host="glow-size" type="range" min="0" max="400" step="5" /></label>
      <button id="scale" data-host="scale" type="button"></button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

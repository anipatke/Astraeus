<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orion in three steps</title>
    <style>
      /* The viewer fills the window; its own controls, cards and story panel place themselves, so the page adds nothing that could overlap them. */
      html, body { margin: 0; height: 100%; background: #000; }
      body { display: flex; flex-direction: column; }
      #app { flex: 1 1 auto; min-height: 0; position: relative; }
      /* The page's own control strip sits under the viewer, so nothing overlaps at any window size. */
      #controls { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 4px 12px; min-height: 48px; box-sizing: border-box; background: #0b0f16; border-top: 1px solid #263040; color: #dfe6f0; font: 14px/1.3 system-ui, sans-serif; }
      #controls label { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; }
      #controls input[type="range"] { flex: 1 1 auto; min-width: 0; height: 44px; margin: 0; }
      #view-width-value { min-width: 3em; text-align: right; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="controls">
      <label>View width <input id="view-width" data-host="view-width" type="range" min="5" max="100" step="1" /> <span id="view-width-value"></span></label>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astraeus</title>
    <style>
      #boot { position: fixed; inset: 0; z-index: 50; pointer-events: none; display: grid; place-content: center; justify-items: center; gap: 18px; background: #000; color: #c7bdb3; font: 13px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .12em; text-transform: uppercase; opacity: 1; transition: opacity var(--boot-fade, .6s) ease; }
      #boot[data-state="done"] { opacity: 0; pointer-events: none; }
      #boot svg { width: 96px; height: 96px; overflow: visible; }
      #boot .ring { fill: none; stroke: rgba(240, 230, 218, .18); stroke-width: 1; }
      #boot .body { fill: #fc6323; }
      #boot .orbiter { transform-origin: 48px 48px; animation: boot-spin 2.4s linear infinite; }
      #boot .failed, #boot[data-state="failed"] .loading, #boot[data-state="failed"] svg { display: none; }
      #boot[data-state="failed"] .failed { display: block; letter-spacing: .04em; text-transform: none; font-size: 14px; color: #f0e6da; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .orbiter { animation: none; transform: rotate(-50deg); } #boot { transition-duration: 0s; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" data-state="loading">
      <svg viewBox="0 0 96 96" aria-hidden="true"><circle class="ring" cx="48" cy="48" r="40"/><g class="orbiter"><circle class="body" cx="48" cy="8" r="3.5"/></g></svg>
      <span class="loading">Loading</span>
      <span class="failed">This could not be loaded. Reload the page to try again.</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
